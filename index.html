<script>
/* ---------- แบบสอบถาม (ข้อความตามฉบับจริง) ---------- */
const OBS=[
 {key:'slow',title:'1. ภาวะเรียนรู้ช้า',from:1,items:[
  'เรียนรู้บทเรียนได้ช้ากว่าบุคคลอื่นในห้อง','ลืมง่าย จำในสิ่งที่เพิ่งเรียนไปไม่ได้ ต้องเรียนซ้ำๆ','กล้ามเนื้อมือไม่แข็งแรง ทำงานที่ใช้มือดูงุ่มง่าม','สรุปใจความสำคัญของเนื้อหาที่เรียนไม่ได้','ไหวพริบในการแก้ปัญหาเฉพาะหน้าไม่สมวัย','ตอบสนองต่อสิ่งต่าง ๆ ช้า','ชอบเล่นกับเด็กที่มีอายุน้อยกว่า','ช่วยเหลือตนเองในกิจวัตรประจำวันได้น้อย','การใช้ภาษาไม่สมวัย','เล่นไม่ค่อยทันเพื่อน']},
 {key:'ld',title:'2. ภาวะแอลดี (LD)',from:11,items:[
  'ดูฉลาดหรือปกติในด้านอื่นๆ ยกเว้นเรื่องเรียน','อ่านผิดบ่อย ๆ อ่านไม่คล่อง หรืออ่านไม่ได้','อ่านข้ามคำ อ่านเพิ่มคำ','อ่านแล้วจับใจความสำคัญไม่ได้','เขียนพยัญชนะหรือตัวเลขที่คล้ายกันสลับกัน เช่น ม - น, ด - ค','เขียนผิด เขียนไม่คล่องบ่อย ๆ','สะกดคำตามการผสมเสียงไม่ได้ เขียนคำต่างๆ จากการจำ','ไม่เข้าใจค่าของจำนวน เช่น หน่วย สิบ ร้อย พัน หมื่น','คำนวณ บวก ลบ คูณ หาร ไม่ได้','ไม่เข้าใจหลักการพื้นฐานทางคณิตศาสตร์ เช่น สัญลักษณ์ เวลา ทิศทาง ขนาด ระยะทาง การจัดลำดับ การเปรียบเทียบ']},
 {key:'adhd',title:'3. ภาวะสมาธิสั้น',from:21,items:[
  'ซนมาก อยู่ไม่นิ่ง ยุกยิกตลอดเวลา','พูดมาก','ชอบลุกจากที่นั่งเวลาอยู่ในห้องเรียน','เหม่อบ่อย ๆ ใจลอย ต้องคอยเรียก','ขี้ลืม ของใช้ส่วนตัวหายบ่อย ๆ','ทำงานไม่เรียบร้อย ไม่รอบคอบ','ไม่มีสมาธิในการทำงาน หรือทำได้เพียงช่วงสั้น ๆ','ทำงานช้า ทำงานไม่เสร็จ แต่ถ้ามีคนประกบจะทำได้เร็วขึ้น','รอคอยไม่ได้','ใจร้อน ควบคุมอารมณ์ไม่ค่อยได้']},
 {key:'autism',title:'4. ภาวะออทิสติก',from:31,items:[
  'ชอบแยกตัวอยู่คนเดียว','สบตาเพียงช่วงสั้น ๆ หรือไม่สบตา เวลาพูดกับคนอื่น','เมื่อเล่นกับเด็กอื่นๆ ไม่เข้าใจกติกา ไม่เข้าใจวิธีการเล่น','ไม่มีเพื่อนสนิท หรือมีเพื่อนน้อย','ไม่สามารถร่วมสนทนากับเพื่อน หรือไม่สามารถต่อบทสนทนากับผู้อื่นได้','มีระดับการใช้ภาษาที่ต่ำกว่าวัย','มักพูดแต่สิ่งที่ตนเองสนใจ ไม่สนใจเมื่อเพื่อนพูดเรื่องอื่นๆ','ไม่เข้าใจมุขตลก คำพังเพย คำประชด','ไม่ชอบการเปลี่ยนแปลง ชอบทำกิจวัตรเดิมๆซ้ำๆ','มีพฤติกรรมกระตุ้นตนเอง สะบัดมือ เล่นมือ']}
];
const OBS_CUT=6;
const OBS_NEXT={
 slow:'ให้คัดกรองด้วยแบบคัดกรองของ สพฐ. ต่อไป (ปัญหาการเรียนจากระดับสติปัญญาต่ำกว่าเกณฑ์)',
 ld:'ให้คัดกรองด้วยแบบคัดกรองของ สพฐ. ต่อไป (แนวโน้มแอลดี)',
 adhd:'ให้คัดกรองด้วยแบบคัดกรอง SNAP-IV ต่อไป',
 autism:'ให้คัดกรองด้วยแบบคัดกรอง PDDSQ ต่อไป'};
const COND={slow:'เรียนรู้ช้า',ld:'แอลดี (LD)',adhd:'สมาธิสั้น',autism:'ออทิสติก',odd:'ดื้อต่อต้าน'};
const COND_KEYS=['slow','ld','adhd','autism','odd'];

const SNAP=[
 {key:'inatt',title:'อาการขาดสมาธิ',items:['มักไม่ละเอียดรอบคอบหรือสะเพร่าในการทำงานต่าง ๆ เช่น การบ้าน','ทำอะไรนาน ๆ ไม่ได้','ดูเหมือนไม่ค่อยฟังเวลามีคนพูดด้วย','มักทำการบ้านไม่เสร็จ หรือทำงานที่ได้รับมอบหมายไม่สำเร็จ','จัดระเบียบงานและกิจกรรมต่างๆ ไม่เป็น','มักหลีกเลี่ยงกิจกรรมที่ต้องใช้ความอดทนในการทำให้สำเร็จ','ทำของหายบ่อย ๆ (เช่น ของเล่น สมุดจดงาน เครื่องเขียน)','วอกแวกง่าย','ขี้ลืม'],cut:{T:18,P:16}},
 {key:'hyper',title:'อาการอยู่ไม่นิ่ง/หุนหันพลันแล่น',items:['มือเท้ายุกยิก นั่งบิดไปมา','นั่งไม่ติดที่ ชอบลุกจากที่นั่งในชั้นเรียน หรือจากที่ที่ควรจะนั่งเรียบร้อย','วิ่งหรือปีนป่ายมากเกินควรอย่างไม่รู้กาลเทศะ','เล่นหรือทำกิจกรรมเงียบ ๆ ไม่เป็น','พร้อมจะเคลื่อนไหวอยู่เสมอเหมือนติดเครื่องอยู่ตลอดเวลา','พูดมาก','มักโพล่งคำตอบออกมาก่อนจะฟังคำถามจบ','ไม่ชอบรอคิว','ชอบสอดแทรกผู้อื่น เช่น ชอบพูดแทรกขณะผู้ใหญ่กำลังสนทนากัน'],cut:{T:11,P:14}},
 {key:'odd',title:'อาการดื้อต่อต้าน',items:['อารมณ์เสียง่าย','ชอบโต้เถียงกับผู้ใหญ่','ไม่ยอมทำตามสิ่งที่ผู้ใหญ่สั่งหรือวางกฎเกณฑ์ไว้','จงใจก่อกวนผู้อื่น','มักตำหนิผู้อื่นในสิ่งที่ตนเองทำผิด','ขี้รำคาญ','โกรธบึ้งตึงเป็นประจำ','เจ้าคิดเจ้าแค้น'],cut:{T:8,P:12}}
];
const SNAP_OPTS=['ไม่เลย','เล็กน้อย','ค่อนข้างมาก','มาก'];

/* ---------- คิดคะแนน ---------- */
function scoreObs(ans){ // ans: array 40 of 1/0/null
  const sc={},fl={};
  OBS.forEach((s,i)=>{let n=0;for(let k=0;k<10;k++)n+=ans[i*10+k]===1?1:0;sc[s.key]=n;fl[s.key]=n>=OBS_CUT});
  return {scores:sc,flags:fl};
}
function scoreSnap(ans,who){ // who 'T'|'P'
  const sc={},fl={};let off=0;
  SNAP.forEach(s=>{let n=0;for(let k=0;k<s.items.length;k++)n+=(+ans[off+k]||0);off+=s.items.length;sc[s.key]=n;fl[s.key]=n>=s.cut[who]});
  return {scores:sc,flags:fl};
}
const SNAP_N=26;

/* ---------- state ---------- */
const S={role:'officer',tab:'summary',students:{},shots:{},actions:{},ready:false,canWrite:null,
  sid:'',school:'',grade:'',draft:null,filter:{school:'',grade:'',status:''},onlyNeed:false,imp:null,open:null,dbErr:false};
let db=null,dl=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

const ROLES={officer:'เจ้าหน้าที่',teacher:'ครูประจำชั้น',parent:'ผู้ปกครอง (อสม.)'};
const TABS={
 officer:[['summary','สรุปผลการดำเนินการ'],['students','นักเรียนและการติดตาม']],
 teacher:[['obs','แบบสังเกต 4 โรค'],['snapT','SNAP-IV (ครู)'],['summary','สรุปผล']],
 parent:[['obsP','แบบสังเกต 4 โรค'],['snapP','SNAP-IV (ไม่บังคับ)'],['summary','สรุปผล']]};
const isObsTab=t=>t==='obs'||t==='obsP';

/* ---------- ข้อมูลที่คำนวณต่อคน ---------- */
function derive(sid){
  const obsT=S.shots[sid+'_obs'],obsP=S.shots[sid+'_obsP'],obs=obsT||obsP,t=S.shots[sid+'_snapT'],p=S.shots[sid+'_snapP'];
  const flag={},src={};COND_KEYS.forEach(c=>{flag[c]=false;src[c]=[]});
  const add=(c,w)=>{flag[c]=true;if(!src[c].includes(w))src[c].push(w)};
  [[obsT,'แบบสังเกต (ครู)'],[obsP,'แบบสังเกต (ผู้ปกครอง/อสม.)']].forEach(([o,w])=>{if(o)OBS.forEach(s=>{if(o.flags[s.key])add(s.key,w)})});
  const obsAdhd=!!((obsT&&obsT.flags.adhd)||(obsP&&obsP.flags.adhd));
  const needSnap=obsAdhd&&!t;
  [[t,'SNAP-IV ครู'],[p,'SNAP-IV ผู้ปกครอง']].forEach(([d,w])=>{if(!d)return;
    if(d.flags.inatt||d.flags.hyper)add('adhd',w);if(d.flags.odd)add('odd',w)});
  const flagged=COND_KEYS.filter(c=>flag[c]);
  const act=(S.actions[sid]&&S.actions[sid].conds)||{};
  const stat=c=>(act[c]&&act[c].status)||'pending';
  let stage;
  if(!obsT&&!obsP&&!t&&!p)stage='none';
  else if(!flagged.length)stage='normal';
  else if(flagged.every(c=>stat(c)!=='pending'))stage='done';
  else stage='pending';
  return {obs,obsT,obsP,t,p,flag,src,flagged,act,stat,stage,obsAdhd,needSnap};
}

function idOk(d){if(!/^\d{13}$/.test(d))return false;let t=0;for(let i=0;i<12;i++)t+=(+d[i])*(13-i);return (11-t%11)%10===+d[12]}
function maskId(raw){const d=String(raw||'').replace(/\D/g,'');if(!idOk(d))return null;return d[0]+'-'+d.slice(1,5)+'-xxxxx-'+d.slice(10,12)+'-'+d[12]}
const NOSCH='ไม่ระบุโรงเรียน',NOGRD='ไม่ระบุชั้น';
const schOf=i=>S.students[i].school||NOSCH, grdOf=i=>S.students[i].grade||NOGRD;
const natSort=(a,b)=>a.localeCompare(b,'th',{numeric:true});
function agg(list,keyFn){
  const m={};list.forEach(id=>{const d=derive(id);const k=keyFn(id);const o=m[k]||(m[k]={n:0,scr:0,found:0,pend:0,done:0});
    o.n++;if(d.stage!=='none')o.scr++;if(d.flagged.length)o.found++;if(d.stage==='pending')o.pend++;if(d.stage==='done')o.done++});
  return m;
}
function stats(){
  const f=S.filter,all=Object.keys(S.students);
  const schoolOpts=[...new Set(all.map(schOf))].sort(natSort);
  if(f.school&&!schoolOpts.includes(f.school))f.school='';
  const inSchool=all.filter(i=>!f.school||schOf(i)===f.school);
  const gradeOpts=[...new Set(inSchool.map(grdOf))].sort(natSort);
  if(f.grade&&!gradeOpts.includes(f.grade))f.grade='';
  const ids=inSchool.filter(i=>!f.grade||grdOf(i)===f.grade);
  const D=ids.map(i=>[i,derive(i)]);
  const n=ids.length;
  const obsN=D.filter(([,d])=>d.obsT||d.obsP).length;
  const needSnap=D.filter(([,d])=>d.needSnap).length;
  const snapN=D.filter(([,d])=>d.t||d.p).length;
  const by={none:0,normal:0,pending:0,done:0};D.forEach(([,d])=>by[d.stage]++);
  const cond={};COND_KEYS.forEach(c=>{const fl=D.filter(([,d])=>d.flag[c]);cond[c]={found:fl.length,done:fl.filter(([,d])=>d.stat(c)!=='pending').length,
    referred:fl.filter(([,d])=>d.stat(c)==='referred').length}});
  const schools=agg(all,schOf);
  const classes=agg(inSchool,i=>schOf(i)+'\u0001'+grdOf(i));
  return {D,n,obsN,needSnap,snapN,by,cond,schools,classes,schoolOpts,gradeOpts,total:all.length};
}

function parseCsv(t){
  const rows=[];let row=[],f='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function rowsToStudents(grid){
  grid=grid.map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(c=>c));
  if(!grid.length)return [];
  let hi=grid.findIndex(r=>r.some(c=>/ชื่อ/.test(c)));
  let col={},start=0;
  if(hi>=0&&hi<5){
    start=hi+1;const H=grid[hi];
    const find=re=>H.findIndex(c=>re.test(c));
    col.full=find(/ชื่อ.*สกุล/);col.pre=find(/คำนำหน้า|^คำนำ/);col.last=H.findIndex(c=>/สกุล/.test(c)&&!/ชื่อ.*สกุล/.test(c));
    col.first=H.findIndex((c,i)=>/^ชื่อ/.test(c)&&i!==col.full);
    col.cid=find(/บัตร|ประชาชน|ปชช/);col.age=find(/อายุ/);col.grade=find(/ชั้น/);col.school=find(/โรงเรียน|สถานศึกษา/);
  }else{col={full:0,pre:-1,last:-1,first:-1,cid:-1,age:1,grade:2,school:3}}
  const g=(r,i)=>i>=0?(r[i]||''):'';
  return grid.slice(start).map(r=>{
    let name=col.full>=0?g(r,col.full):[g(r,col.pre),g(r,col.first),g(r,col.last)].filter(Boolean).join(' ');
    if(col.full>=0&&col.pre>=0&&g(r,col.pre))name=g(r,col.pre)+name;
    return {name:name.trim(),cid:g(r,col.cid),age:g(r,col.age).replace(/[^0-9]/g,''),grade:g(r,col.grade),school:g(r,col.school)};
  });
}
async function readRosterFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  let grid;
  if(ext==='csv'||file.type==='text/csv'){grid=parseCsv(await file.text())}
  else{
    if(typeof XLSX==='undefined')throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองบันทึกไฟล์เป็น .csv แล้วแนบใหม่');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    grid=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  }
  return rowsToStudents(grid);
}

    let off=0;const who=S.tab==='snapT'?'T':'P';
    SNAP.forEach(s=>{h+=`<div class="sec"><h3><span>${s.title}</span><span class="pill p-mute" id="sc_${s.key}"></span></h3>`;
      s.items.forEach((t,k)=>{const n=off+k;h+=`<div class="q"><div class="t"><em>${n+1}.</em>${esc(t)}</div><div class="opts">${SNAP_OPTS.map((o,v)=>`<label><input type="radio" name="q${n}" value="${v}" ${D.answers[n]===v?'checked':''}><span>${o}</span></label>`).join('')}</div></div>`});
      off+=s.items.length;h+='</div>'});
  }
  h+=`<div class="card stack"><div id="result"></div><div class="row"><button class="btn pri" id="saveForm" ${S.canWrite===false?'disabled':''}>บันทึกผลการคัดกรอง</button>
  ${S.shots[formDocId()]?'<span class="note">เคยบันทึกแล้ว การบันทึกใหม่จะแทนที่ผลเดิม</span>':''}${S.canWrite===false?'<span class="note">บัญชีนี้ไม่มีสิทธิ์บันทึก</span>':''}</div></div></div>`;
  return h;
}
function liveResult(){
  const D=S.draft,box=$('#result');if(!box)return;
  const total=isObsTab(S.tab)?40:SNAP_N;const done=D.answers.filter(v=>v!==null).length;
  let r,html='';
  if(isObsTab(S.tab)){
    r=scoreObs(D.answers);
    OBS.forEach(s=>{const el=$('#sc_'+s.key);if(el){el.textContent=r.scores[s.key]+'/10 คะแนน';el.className='pill '+(r.flags[s.key]?'p-bad':'p-mute')}});
    const fl=OBS.filter(s=>r.flags[s.key]);
    html=fl.length?`<div class="res bad"><b>พบแนวโน้ม ${fl.length} ภาวะ (ตอบ “ใช่” ตั้งแต่ 6 ข้อขึ้นไป)</b>${fl.map(s=>`<div>• ${COND[s.key]}: ${OBS_NEXT[s.key]}</div>`).join('')}</div>`
      :`<div class="res ok"><b>ยังไม่พบหมวดที่ถึงเกณฑ์ (ต่ำกว่า 6 คะแนนทุกหมวด)</b></div>`;
  }else{
    const who=S.tab==='snapT'?'T':'P';r=scoreSnap(D.answers,who);
    SNAP.forEach(s=>{const el=$('#sc_'+s.key);if(el){el.textContent=r.scores[s.key]+' คะแนน (จุดตัด ≥'+s.cut[who]+')';el.className='pill '+(r.flags[s.key]?'p-bad':'p-mute')}});
    const fl=SNAP.filter(s=>r.flags[s.key]);
    html=fl.length?`<div class="res bad"><b>คะแนนถึงจุดตัด ${fl.length} ด้าน</b>${fl.map(s=>`<div>• ${s.title}: ${r.scores[s.key]} คะแนน (จุดตัด ≥${s.cut[who]})</div>`).join('')}</div>`
      :`<div class="res ok"><b>ทุกด้านต่ำกว่าจุดตัด</b></div>`;
  }
  box.innerHTML=`<div class="note">ตอบแล้ว ${done}/${total} ข้อ${done<total?' (ข้อที่ไม่ตอบนับเป็น 0 คะแนน)':''}</div>`+html;
}
function bindForm(){
  const on=$('#onlyNeed');if(on)on.onchange=()=>{S.onlyNeed=on.checked;S.sid='';S.draft=null;render()};
  const sc=$('#scSel');if(sc)sc.onchange=()=>{S.school=sc.value;S.grade='';S.sid='';S.draft=null;render()};
  const g=$('#gSel');if(g)g.onchange=()=>{S.grade=g.value;S.sid='';S.draft=null;render()};
  const s=$('#sSel');if(s)s.onchange=()=>{S.sid=s.value;S.draft=null;render()};
  const b=$('#addStu');if(b)b.onclick=addStudent;
  bindImport();
  if(!S.sid)return;
  const D=S.draft;
  document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{D.answers[+r.name.slice(1)]=+r.value;liveResult()});
  const bind=(id,k)=>{const e=$(id);if(e)e.oninput=e.onchange=()=>D[k]=e.value};
  bind('#resp','respondent');bind('#dt','date');bind('#rel','rel');bind('#avg','avg');
  $('#saveForm').onclick=saveForm;liveResult();
}
async function saveForm(){
  const D=S.draft;if(!D.respondent.trim()){toast('กรุณากรอกชื่อผู้ตอบ');$('#resp').focus();return}
  const who=S.tab==='snapT'?'T':'P';
  const r=isObsTab(S.tab)?scoreObs(D.answers):scoreSnap(D.answers,who);
  const doc={studentId:S.sid,type:S.tab,answers:D.answers,respondent:D.respondent.trim(),rel:D.rel||'',date:D.date,avg:D.avg||'',scores:r.scores,flags:r.flags,updatedAt:Date.now()};
  try{await db.doc('screenings/'+formDocId()).set(doc);toast('บันทึกผลการคัดกรองแล้ว')}
  catch(e){toast('บันทึกไม่ได้: '+(e.code||'ไม่ทราบสาเหตุ'))}
}

/* ---------- เริ่มต้น ---------- */
function snapToMap(snap){const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});return o}
function refresh(){
  // อย่ารีเรนเดอร์ทับแบบฟอร์มที่กำลังกรอก
  if(isForm()&&S.sid&&S.draft){return}
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#app')&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&S.ready){return}
  render();
}
/* ---------- ส่วนเชื่อม Supabase (ล็อกอินอีเมล + ฐานข้อมูล) ---------- */
window.STANDALONE=true;
const CFG=window.APP_CONFIG||{};
const ROLE_UI={officer:'officer',teacher:'teacher',asm:'parent'};
let sb=null,curUid=undefined,subsOff=[];

function dbError(e){const x=new Error(e.message||'error');x.code=(e.code==='42501'||/row-level security/i.test(e.message||''))?'ไม่มีสิทธิ์ทำรายการนี้':(e.message||e.code||'ไม่ทราบสาเหตุ');return x}
function makeDb(sb){
  const T={
    students:{cols:'id,name,cid,age,grade,school,created_at',key:'id',filter:q=>q.is('deleted_at',null),doc:r=>({name:r.name,cid:r.cid||'',age:r.age||'',grade:r.grade||'',school:r.school||''})},
    screenings:{cols:'id,student_id,type,answers,respondent,rel,date,avg,scores,flags,updated_at',key:'id',doc:r=>({studentId:r.student_id,type:r.type,answers:r.answers,respondent:r.respondent||'',rel:r.rel||'',date:r.date||'',avg:r.avg||'',scores:r.scores,flags:r.flags})},
    actions:{cols:'student_id,conds,updated_at',key:'student_id',doc:r=>({conds:r.conds||{}})}};
  async function fetchAll(t){
    const c=T[t],out=[];
    for(let from=0;;from+=1000){
      let q=sb.from(t).select(c.cols).order(c.key).range(from,from+999);if(c.filter)q=c.filter(q);
      const {data,error}=await q;if(error)throw dbError(error);
      out.push(...data);if(data.length<1000)break}
    return out}
  function watch(t,cb,errcb){
    let alive=true,busy=false,again=false,timer=null;
    const load=async()=>{
      if(!alive)return;if(busy){again=true;return}busy=true;
      try{const rows=await fetchAll(t);if(alive)cb({docs:rows.map(r=>({id:r[T[t].key],data:()=>T[t].doc(r)}))})}
      catch(e){if(alive&&errcb)errcb(e)}
      busy=false;if(again){again=false;load()}};
    const ch=sb.channel('rt-'+t+'-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(timer);timer=setTimeout(load,300)}).subscribe();
    const poll=setInterval(load,30000);load();
    return ()=>{alive=false;clearInterval(poll);clearTimeout(timer);try{sb.removeChannel(ch)}catch(e){}}}
  return {
    collection(t){return {
      add:async o=>{
        if(t!=='students')throw dbError({message:'unsupported'});
        const id=crypto.randomUUID();
        const {error}=await sb.from('students').insert({id,name:o.name,cid:o.cid||'',age:String(o.age||''),grade:o.grade||'',school:o.school||''});
        if(error)throw dbError(error);return {id}},
      onSnapshot:(cb,e)=>watch(t,cb,e)}},
    doc(path){const [t,id]=path.split('/');return {
      set:async o=>{
        let row,conflict;
        if(t==='screenings'){row={id,student_id:o.studentId,type:o.type,answers:o.answers,respondent:o.respondent||'',rel:o.rel||'',date:o.date||null,avg:o.avg||'',scores:o.scores,flags:o.flags};conflict='id'}
        else if(t==='actions'){row={student_id:id,conds:o.conds||{}};conflict='student_id'}
        else throw dbError({message:'unsupported'});
        const {error}=await sb.from(t).upsert(row,{onConflict:conflict});if(error)throw dbError(error)},
      delete:async()=>{
        if(t==='students'){const {error}=await sb.from('students').update({deleted_at:new Date().toISOString()}).eq('id',id);if(error)throw dbError(error)}
        /* ผลคัดกรอง/การดำเนินการ: เก็บไว้ (ลบนักเรียนแบบกู้คืนได้) */}}}}}

dl={save:async({filename,data})=>{
  const blob=new Blob([data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);return {status:'saved'}}};

function gateCard(inner){return `<div class="card stack" style="max-width:520px;margin:24px auto">${inner}</div>`}
function loginGate(){return gateCard(`<h2>เข้าสู่ระบบ</h2>
  <div class="note">กรอกอีเมลที่เจ้าหน้าที่ลงทะเบียนไว้ ระบบจะส่งลิงก์เข้าสู่ระบบไปให้ทางอีเมล (ไม่ต้องใช้รหัสผ่าน) เปิดลิงก์บนเครื่องนี้เพื่อเข้าใช้งาน</div>
  <label class="f" style="flex:none">อีเมล<input type="text" id="lgEmail" inputmode="email" autocomplete="email" placeholder="name@example.com"></label>
  <div><button class="btn pri" id="lgGo">ส่งลิงก์เข้าสู่ระบบ</button></div><div id="lgMsg" class="note" role="status"></div>`)}
function noAccessGate(why){return gateCard(`<h2>ยังไม่ได้รับสิทธิ์ใช้งาน</h2>
  <div class="note">บัญชีนี้ล็อกอินได้ แต่ยังไม่ได้กำหนดบทบาท หรือถูกปิดการใช้งาน กรุณาแจ้งเจ้าหน้าที่ผู้ดูแลระบบ${why?'<br>('+esc(why)+')':''}</div>
  <div><button class="btn" data-logout="1">ออกจากระบบ</button></div>`)}
function setupGate(){return gateCard(`<h2>ยังไม่ได้ตั้งค่าการเชื่อมต่อ</h2>
  <div class="note">เปิดไฟล์ config.js แล้วใส่ SUPABASE_URL และ SUPABASE_ANON_KEY ของโปรเจกต์ Supabase (ดูขั้นตอนในคู่มือ)</div>`)}
function bindGate(){
  const go=$('#lgGo');if(!go)return;
  const send=async()=>{
    const email=$('#lgEmail').value.trim().toLowerCase(),msg=$('#lgMsg');
    if(!/^\S+@\S+\.\S+$/.test(email)){msg.textContent='กรุณากรอกอีเมลให้ถูกต้อง';return}
    go.disabled=true;msg.textContent='กำลังส่งลิงก์…';
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});
    go.disabled=false;
    if(error)msg.textContent=/signups? not allowed|not found/i.test(error.message)?'อีเมลนี้ยังไม่ได้ลงทะเบียน กรุณาแจ้งเจ้าหน้าที่':'ส่งลิงก์ไม่สำเร็จ: '+error.message;
    else msg.textContent='ส่งลิงก์ไปที่ '+email+' แล้ว เปิดอีเมลและกดลิงก์บนเครื่องนี้ (ตรวจในกล่องสแปมด้วย)'};
  go.onclick=send;$('#lgEmail').onkeydown=e=>{if(e.key==='Enter')send()};
}
document.addEventListener('click',e=>{if(e.target.closest('[data-logout]')&&sb)sb.auth.signOut()});

function stopSubs(){subsOff.forEach(f=>{try{f()}catch(e){}});subsOff=[]}
async function handleSession(session){
  const uid=(session&&session.user&&session.user.id)||null;
  if(uid===curUid)return; curUid=uid; stopSubs();
  S.students={};S.shots={};S.actions={};S.sid='';S.draft=null;S.open=null;S.imp=null;S.me=null;
  if(!uid){S.gate=loginGate();S.ready=true;render();return}
  S.gate=null;S.ready=false;render();
  const {data,error}=await sb.from('staff').select('role,display_name,active').eq('user_id',uid).maybeSingle();
  if(uid!==curUid)return;
  if(error||!data||!data.active){S.gate=noAccessGate(error&&error.message);S.ready=true;render();return}
  S.me={name:data.display_name||session.user.email||'',dbRole:data.role};
  S.role=ROLE_UI[data.role];S.tab=TABS[S.role][0][0];S.canWrite=true;
  db=makeDb(sb);
  let first=0;const hit=()=>{if(++first>=3)S.ready=true;refresh()};
  const err=e=>{toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ กำลังลองใหม่: '+(e.code||''))};
  subsOff.push(db.collection('students').onSnapshot(s=>{S.students=snapToMap(s);if(S.sid&&!S.students[S.sid]){S.sid='';S.draft=null}hit()},err));
  subsOff.push(db.collection('screenings').onSnapshot(s=>{S.shots=snapToMap(s);hit()},err));
  subsOff.push(db.collection('actions').onSnapshot(s=>{S.actions=snapToMap(s);hit()},err));
  render();
}
(async()=>{
  S.ready=false;render();
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||!window.supabase){S.gate=setupGate();S.ready=true;render();return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((evt,session)=>{handleSession(session)});
  const {data}=await sb.auth.getSession();handleSession(data.session);
})();
</script>
