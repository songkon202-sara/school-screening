<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar (role switcher) + tab row, single centered column of work cards (max 1040px). */
:root{
  --bg:#eef3f4; --surface:#ffffff; --ink:#14262d; --muted:#52696f; --line:#d3dee1;
  --hd1:#0a5f61; --hd2:#13867f; --shadow:0 1px 2px rgba(16,40,46,.06),0 4px 14px rgba(16,40,46,.06);
  --accent:#0b7a75; --accent-ink:#ffffff; --accent-soft:#dcf0ee;
  --warn:#a9500a; --warn-soft:#fdeedb;
  --bad:#b0281d; --bad-soft:#fde6e3;
  --ok:#17794a; --ok-soft:#e0f3e8;
  --info:#2556a8; --info-soft:#e5ecfa;
  --f-head:"Prompt","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e191d; --surface:#152327; --ink:#e5eef0; --muted:#9db2b9; --line:#294046;
  --hd1:#0d3a3d; --hd2:#124c4c; --shadow:0 1px 2px rgba(0,0,0,.3);
  --accent:#43c4ba; --accent-ink:#06201e; --accent-soft:#12383a;
  --warn:#f0b15a; --warn-soft:#3a2a11;
  --bad:#ff9288; --bad-soft:#3e1b18;
  --ok:#64d89a; --ok-soft:#123323;
  --info:#8fb5ff; --info-soft:#172a4e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e191d; --surface:#152327; --ink:#e5eef0; --muted:#9db2b9; --line:#294046;
  --hd1:#0d3a3d; --hd2:#124c4c; --shadow:0 1px 2px rgba(0,0,0,.3);
  --accent:#43c4ba; --accent-ink:#06201e; --accent-soft:#12383a;
  --warn:#f0b15a; --warn-soft:#3a2a11;
  --bad:#ff9288; --bad-soft:#3e1b18;
  --ok:#64d89a; --ok-soft:#123323;
  --info:#8fb5ff; --info-soft:#172a4e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;box-shadow:0 2px 10px rgba(8,50,52,.25)}
header.top .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
header.top .btn:hover{background:rgba(255,255,255,.25)}
header.top .note,header.top .brand small{color:rgba(255,255,255,.85)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.brand h1{font-size:19px;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:13px}
.userbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.roles{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.roles button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
td input[data-uname]{width:100%;max-width:260px;box-sizing:border-box}@media(max-width:700px){td input[data-uname]{max-width:100%}}
nav.tabs button{border:0;background:transparent;padding:10px 16px;cursor:pointer;color:rgba(255,255,255,.78);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
nav.tabs button::before{content:attr(data-ic);margin-right:6px}
nav.tabs button[aria-selected="true"]{color:#fff;font-weight:700;border-bottom-color:#fff}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card>h2{font-size:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>*{min-width:0}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
#qrUrl{color:var(--accent);word-break:break-all}
label.f{display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--muted);flex:1 1 180px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;min-height:58px;font-size:19px;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;min-height:46px;cursor:pointer;font-weight:600;transition:transform .08s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.pri{box-shadow:0 2px 6px rgba(11,122,117,.35)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:15px}
.btn.block{width:100%}
.btn.xl{min-height:54px;font-size:18px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.nw,td .btn{white-space:nowrap}
@media (max-width:600px){header.top{position:static}.brand h1{font-size:16px}.roles button{padding:6px 10px;font-size:14px}.card{padding:14px}.kpi b{font-size:26px}}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpis.hero{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);border-left:6px solid var(--line)}
.kpi.k-ok{border-left-color:var(--ok)}.kpi.k-bad{border-left-color:var(--bad)}.kpi.k-info{border-left-color:var(--info)}.kpi.k-acc{border-left-color:var(--accent)}.kpi.k-warn{border-left-color:var(--warn)}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-family:var(--f-head);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
tbody tr:hover{background:var(--bg)}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;min-width:120px}
.bar i{display:block;height:100%}
.sec{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sec>summary,.sec>h3{padding:14px 16px;background:var(--bg);font-size:17px;font-family:var(--f-head);font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer;list-style:none;min-height:52px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'▸';margin-right:8px;transition:transform .15s;color:var(--accent)}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec>summary>span:first-child{flex:1}
.q{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
.q .t{flex:1 1 300px;min-width:0}
.q .t em{font-style:normal;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{position:relative;cursor:pointer}
.opts input{position:absolute;opacity:0;inset:0}
.opts span{display:flex;align-items:center;justify-content:center;min-width:64px;min-height:44px;padding:6px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--bg);user-select:none;transition:background .1s}
.opts input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.opts input:focus-visible+span{outline:3px solid var(--info);outline-offset:2px}
.res{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.res.bad{background:var(--bad-soft)}.res.ok{background:var(--ok-soft)}.res.warn{background:var(--warn-soft)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.note{font-size:15px;color:var(--muted)}
.flagrow{display:flex;gap:4px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:9;font-weight:600}
@media (prefers-reduced-motion:no-preference){.card,.kpi{transition:border-color .15s}}
/* ---- ตัวเลือกนักเรียนแบบการ์ด + แถบความคืบหน้า ---- */
.prog{display:flex;flex-direction:column;gap:6px}
.prog .bar{height:12px}
.stlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-height:min(60vh,520px);overflow:auto;padding:2px}
.stbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:60px;cursor:pointer;box-shadow:var(--shadow)}
.stbtn:hover{border-color:var(--accent)}
.stbtn b{display:block;font-weight:600}.stbtn small{color:var(--muted)}
.stbtn.done{background:var(--ok-soft);border-color:transparent}
.cur{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pbar{position:sticky;top:var(--hh,0px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.pbar .row{gap:6px;align-items:center}
.savebar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 6px 24px rgba(10,40,44,.22)}
.savebar .btn{flex:1 1 220px}
.gatehero{max-width:480px;margin:20px auto}
.gatehero .codein{font-size:26px;text-align:center;letter-spacing:6px;font-weight:700;min-height:62px;text-transform:uppercase}
.gatehero .logo{font-size:44px;text-align:center;line-height:1}
.stackbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line);min-width:140px}
.stackbar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
details.more>summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;min-height:44px;display:flex;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'ⓘ';margin-right:8px}
/* ---- ใบรหัสพร้อม QR (พิมพ์ได้) ---- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;color:#111}
.pcard .pt{font-weight:700;font-size:17px;line-height:1.3}
.pcard .pq{width:100%;max-width:200px;background:#fff}.pcard .pq svg{display:block;width:100%;height:auto}
.pcard .pc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;letter-spacing:3px}
.pcard .pn{font-size:13px;color:#444;line-height:1.4;word-break:break-all}
@media print{
  body.pb{background:#fff;padding:0}
  body.pb header.top,body.pb nav.tabs,body.pb .toast,body.pb .noprint{display:none!important}
  body.pb .card:not(#batchCard){display:none!important}
  body.pb #batchCard{box-shadow:none;border:0;padding:0}
  body.pb .pgrid{grid-template-columns:repeat(2,1fr)}
  body.pb .pcard{break-inside:avoid;border:1.5px solid #999}
}
/* ---- มือถือ: เมนูล่างจอ + ตารางเป็นการ์ด ---- */
@media (max-width:700px){
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  header.top{position:static}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(10,40,44,.14);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:2px;justify-content:space-around;overflow:hidden}
  header.top .top-in{padding-bottom:12px}
  nav.tabs button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border-radius:12px;border-bottom:0;white-space:normal;text-align:center;font-size:12.5px;line-height:1.25;color:var(--muted);min-height:56px;justify-content:center}
  nav.tabs button::before{margin:0 0 2px;font-size:22px;line-height:1}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-bottom:0}
  .savebar{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .q{flex-direction:column;align-items:stretch}.q .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
  .opts span{min-width:0;padding:6px 8px}
  .stlist{grid-template-columns:1fr}
  table.rt thead{display:none}
  table.rt,table.rt tbody{display:block}
  table.rt tr{display:block;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 4px;background:var(--surface);box-shadow:var(--shadow)}
  table.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 10px;text-align:right}
  table.rt td::before{content:attr(data-l);color:var(--muted);font-size:14px;text-align:left;flex:none}
  table.rt td[data-l=""]::before{display:none}
  table.rt td[data-l=""]{justify-content:flex-end}
  .nw,td .btn{white-space:normal}
  .card{padding:16px}
}
</style>

<header class="top"><div class="top-in">
  <div class="brand">
    <div><h1>แบบคัดกรอง 4 กลุ่มโรคและสมาธิสั้น</h1><small>แบบสังเกตพฤติกรรม 4 โรค · SNAP-IV · สรุปผลการดำเนินการ</small></div>

<script>
/* ---------- แบบสอบถาม (ข้อความตามฉบับจริง) ---------- */
const OBS=[
 {key:'slow',title:'1. ภาวะเรียนรู้ช้า',from:1,items:[
  'เรียนรู้บทเรียนได้ช้ากว่าบุคคลอื่นในห้อง','ลืมง่าย จำในสิ่งที่เพิ่งเรียนไปไม่ได้ ต้องเรียนซ้ำๆ','กล้ามเนื้อมือไม่แข็งแรง ทำงานที่ใช้มือดูงุ่มง่าม','สรุปใจความสำคัญของเนื้อหาที่เรียนไม่ได้','ไหวพริบในการแก้ปัญหาเฉพาะหน้าไม่สมวัย','ตอบสนองต่อสิ่งต่าง ๆ ช้า','ชอบเล่นกับเด็กที่มีอายุน้อยกว่า','ช่วยเหลือตนเองในกิจวัตรประจำวันได้น้อย','การใช้ภาษาไม่สมวัย','เล่นไม่ค่อยทันเพื่อน']},
 {key:'ld',title:'2. ภาวะแอลดี (LD)',from:11,items:[
  'ดูฉลาดหรือปกติในด้านอื่นๆ ยกเว้นเรื่องเรียน','อ่านผิดบ่อย ๆ อ่านไม่คล่อง หรืออ่านไม่ได้','อ่านข้ามคำ อ่านเพิ่มคำ','อ่านแล้วจับใจความสำคัญไม่ได้','เขียนพยัญชนะหรือตัวเลขที่คล้ายกันสลับกัน เช่น ม - น, ด - ค','เขียนผิด เขียนไม่คล่องบ่อย ๆ','สะกดคำตามการผสมเสียงไม่ได้ เขียนคำต่างๆ จากการจำ','ไม่เข้าใจค่าของจำนวน เช่น หน่วย สิบ ร้อย พัน หมื่น','คำนวณ บวก ลบ คูณ หาร ไม่ได้','ไม่เข้าใจหลักการพื้นฐานทางคณิตศาสตร์ เช่น สัญลักษณ์ เวลา ทิศทาง ขนาด ระยะทาง การจัดลำดับ การเปรียบเทียบ']},
 {key:'adhd',title:'3. ภาวะสมาธิสั้น',from:21,items:[

}
function scoreSnap(ans,who){ // who 'T'|'P'
  const sc={},fl={};let off=0;
  SNAP.forEach(s=>{let n=0;for(let k=0;k<s.items.length;k++)n+=(+ans[off+k]||0);off+=s.items.length;sc[s.key]=n;fl[s.key]=n>=s.cut[who]});
  return {scores:sc,flags:fl};
}

function derive(sid){
  const obsT=S.shots[sid+'_obs'],obsP=S.shots[sid+'_obsP'],obs=obsT||obsP,t=S.shots[sid+'_snapT'],p=S.shots[sid+'_snapP'];
  const flag={},src={};COND_KEYS.forEach(c=>{flag[c]=false;src[c]=[]});
  const add=(c,w)=>{flag[c]=true;if(!src[c].includes(w))src[c].push(w)};
  [[obsT,'แบบสังเกต (ครู)'],[obsP,'แบบสังเกต (ผู้ปกครอง/อสม.)']].forEach(([o,w])=>{if(o)OBS.forEach(s=>{if(o.flags[s.key])add(s.key,w)})});
  const obsAdhd=!!((obsT&&obsT.flags.adhd)||(obsP&&obsP.flags.adhd));
  const needSnap=obsAdhd&&!t;
  [[t,'SNAP-IV ครู'],[p,'SNAP-IV ผู้ปกครอง']].forEach(([d,w])=>{if(!d)return;
    if(d.flags.inatt||d.flags.hyper)add('adhd',w);if(d.flags.odd)add('odd',w)});
  const flagged=COND_KEYS.filter(c=>flag[c]);
  const act=(S.actions[sid]&&S.actions[sid].conds)||{};
  const stat=c=>(act[c]&&act[c].status)||'pending';
  let stage;
  if(!obsT&&!obsP&&!t&&!p)stage='none';
  else if(!flagged.length)stage='normal';
  else if(flagged.every(c=>stat(c)!=='pending'))stage='done';
  else stage='pending';
  return {obs,obsT,obsP,t,p,flag,src,flagged,act,stat,stage,obsAdhd,needSnap};
}

function idOk(d){if(!/^\d{13}$/.test(d))return false;let t=0;for(let i=0;i<12;i++)t+=(+d[i])*(13-i);return (11-t%11)%10===+d[12]}
function maskId(raw){const d=String(raw||'').replace(/\D/g,'');if(!idOk(d))return null;return d[0]+'-'+d.slice(1,5)+'-xxxxx-'+d.slice(10,12)+'-'+d[12]}
const NOSCH='ไม่ระบุโรงเรียน',NOGRD='ไม่ระบุชั้น';
const schOf=i=>S.students[i].school||NOSCH, grdOf=i=>S.students[i].grade||NOGRD;
const natSort=(a,b)=>a.localeCompare(b,'th',{numeric:true});
function agg(list,keyFn){
  const m={};list.forEach(id=>{const d=derive(id);const k=keyFn(id);const o=m[k]||(m[k]={n:0,scr:0,found:0,pend:0,done:0});
    o.n++;if(d.stage!=='none')o.scr++;if(d.flagged.length)o.found++;if(d.stage==='pending')o.pend++;if(d.stage==='done')o.done++});
  return m;
}
function stats(){
  const f=S.filter,all=Object.keys(S.students);
  const schoolOpts=[...new Set(all.map(schOf))].sort(natSort);
  if(f.school&&!schoolOpts.includes(f.school))f.school='';
  const inSchool=all.filter(i=>!f.school||schOf(i)===f.school);
  const gradeOpts=[...new Set(inSchool.map(grdOf))].sort(natSort);
  if(f.grade&&!gradeOpts.includes(f.grade))f.grade='';
  const ids=inSchool.filter(i=>!f.grade||grdOf(i)===f.grade);
  const D=ids.map(i=>[i,derive(i)]);
  const n=ids.length;
  const obsN=D.filter(([,d])=>d.obsT||d.obsP).length;
  const needSnap=D.filter(([,d])=>d.needSnap).length;
  const snapN=D.filter(([,d])=>d.t||d.p).length;
  const by={none:0,normal:0,pending:0,done:0};D.forEach(([,d])=>by[d.stage]++);
  const cond={};COND_KEYS.forEach(c=>{const fl=D.filter(([,d])=>d.flag[c]);cond[c]={found:fl.length,done:fl.filter(([,d])=>d.stat(c)!=='pending').length,
    referred:fl.filter(([,d])=>d.stat(c)==='referred').length}});
  const schools=agg(all,schOf);
  const classes=agg(inSchool,i=>schOf(i)+'\u0001'+grdOf(i));
  return {D,n,obsN,needSnap,snapN,by,cond,schools,classes,schoolOpts,gradeOpts,total:all.length};
}

function parseCsv(t){
  const rows=[];let row=[],f='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function normVillage(v){
  v=String(v||'').trim();if(!v)return '';
  const nums=v.match(/[0-9๐-๙]+/g);
  if(nums){
    if(nums.length!==1||nums[0].length!==1)return '';
    const d=/[๐-๙]/.test(nums[0])?String('๐๑๒๓๔๕๖๗๘๙'.indexOf(nums[0])):nums[0];
    return VILLAGES[d]?d:'';
  }
  const k=Object.keys(VILLAGES).find(k=>v.replace(/\s/g,'').includes(VILLAGES[k].replace(/^บ้าน/,'')));
  return k||'';
}
function rowsToStudents(grid){
  grid=grid.map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(c=>c));
  if(!grid.length)return [];
  let hi=grid.findIndex(r=>r.some(c=>/ชื่อ/.test(c)));
  let col={},start=0;
  if(hi>=0&&hi<5){
    start=hi+1;const H=grid[hi];
    const find=re=>H.findIndex(c=>re.test(c));
    col.full=find(/ชื่อ.*สกุล/);col.pre=find(/คำนำหน้า|^คำนำ/);col.last=H.findIndex(c=>/สกุล/.test(c)&&!/ชื่อ.*สกุล/.test(c));
    col.first=H.findIndex((c,i)=>/^ชื่อ/.test(c)&&i!==col.full);
    col.cid=find(/บัตร|ประชาชน|ปชช/);col.age=find(/อายุ/);col.grade=find(/ชั้น/);col.school=find(/โรงเรียน|สถานศึกษา/);col.village=find(/หมู่/);
  }else{col={full:0,pre:-1,last:-1,first:-1,cid:-1,age:1,grade:2,school:3,village:-1}}
  const g=(r,i)=>i>=0?(r[i]||''):'';
  return grid.slice(start).map(r=>{
    let name=col.full>=0?g(r,col.full):[g(r,col.pre),g(r,col.first),g(r,col.last)].filter(Boolean).join(' ');
    if(col.full>=0&&col.pre>=0&&g(r,col.pre))name=g(r,col.pre)+name;
    return {name:name.trim(),cid:g(r,col.cid),age:g(r,col.age).replace(/[^0-9]/g,''),grade:g(r,col.grade),school:g(r,col.school),village:normVillage(g(r,col.village))};
  });
}
async function readRosterFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  let grid;
  if(ext==='csv'||file.type==='text/csv'){grid=parseCsv(await file.text())}
  else{
    if(typeof XLSX==='undefined')throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองบันทึกไฟล์เป็น .csv แล้วแนบใหม่');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    grid=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  }
  return rowsToStudents(grid);
}

    try{
      const rows=await readRosterFile(file);
      const seen=new Set(),existing={};Object.keys(S.students).forEach(id=>{const x=S.students[id],k=[x.name,x.school||'',x.grade||'',x.cid||''].join('|');seen.add(k);existing[k]=id});
      rows.forEach(r=>{
        const d=String(r.cid||'').replace(/\D/g,'');delete r.cid;r.cidMask='';
        if(d){const m=maskId(d);if(m)r.cidMask=m;else r.cidBad=true}
        if(!r.name){r.dup='ไม่มีชื่อ';return}
        const k=[r.name,r.school,r.grade,r.cidMask].join('|');
        if(seen.has(k)){const eid=existing[k];if(eid&&r.village&&S.students[eid].village!==r.village&&!r._used){r.fillId=eid;existing[k]=null}else r.dup='ซ้ำ'}else seen.add(k);
      });
      S.imp=rows.length?{file:file.name,rows}:{file:file.name,rows:[],err:'ไม่พบรายชื่อในไฟล์นี้ ตรวจว่าแถวแรกเป็นหัวตารางและมีคอลัมน์ชื่อ'};
    }catch(e){S.imp={file:file.name,rows:[],err:e.message||'อ่านไฟล์ไม่ได้'}}
    render();const b=$('#impBox');b&&b.scrollIntoView({block:'nearest'});
  };
  const t=$('#impTpl');if(t)t.onclick=async()=>{

  };
  const c=$('#impCancel');if(c)c.onclick=()=>{S.imp=null;render()};
  const go=$('#impGo');if(go)go.onclick=importRows;

async function importRows(){
  const rows=S.imp.rows.filter(r=>!r.dup);const go=$('#impGo');if(go)go.disabled=true;
  let n=0;
  try{
    for(let i=0;i<rows.length;i+=20){
      await Promise.all(rows.slice(i,i+20).map(async r=>{
        if(r.fillId){const {error}=await sb.from('students').update({village:r.village}).eq('id',r.fillId);if(error)throw dbError(error);return}
        return db.collection('students').add({name:r.name,cid:r.cidMask||'',age:r.age,grade:r.grade,school:r.school,village:r.village||'',createdAt:Date.now()})}));
      n=Math.min(i+20,rows.length);
    }
    S.imp=null;toast('นำเข้ารายชื่อแล้ว '+rows.length+' คน');render();
  }catch(e){toast('นำเข้าได้ '+n+' จาก '+rows.length+' คน หยุดเพราะ: '+(e.code||'ไม่ทราบสาเหตุ'));if(go)go.disabled=false}
}

function bindOfficer(){
  const fs=$('#fSchool');if(fs){fs.onchange=()=>{S.filter.school=fs.value;S.filter.grade='';render()};$('#fGrade').onchange=e=>{S.filter.grade=e.target.value;render()}}
  const fz=$('#fStatus');if(fz){fz.onchange=e=>{S.filter.status=e.target.value;render()};$('#csv').onclick=exportCsv}
  const b=$('#addStu');if(b)b.onclick=addStudent;
  bindImport();
  document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{S.open=x.dataset.open;if(S.tab==='summary'){S.tab='students'}render();const d=$('#detail');d&&d.scrollIntoView({block:'start'})});
  document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>{S.open=null;render()});

async function addStudent(){

  const rawCid=(($('#nCid')||{}).value||'').replace(/\D/g,'');let cid='';
  if(rawCid){cid=maskId(rawCid);if(!cid){toast('เลขบัตรประชาชนไม่ถูกต้อง ต้องมี 13 หลักและผ่านการตรวจสอบ');$('#nCid').focus();return}}
  try{await db.collection('students').add({name,cid,age:$('#nAge').value||'',grade:$('#nGrade').value.trim(),school:$('#nSchool').value.trim(),village:($('#nVillage')||{}).value||'',createdAt:Date.now()});toast('เพิ่มรายชื่อแล้ว');['#nName','#nCid','#nAge','#nGrade','#nSchool','#nVillage'].forEach(i=>{const e=$(i);if(e)e.value=''})}

async function exportCsv(){

  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')];
  st.D.forEach(([id,d])=>{const s=S.students[id];
    lines.push([s.name,s.cid||'',s.age,s.grade,s.school,STAGE[d.stage][0],d.flagged.map(c=>COND[c]).join(' / '),
     ...OBS.map(o=>d.obsT?d.obsT.scores[o.key]:''),...OBS.map(o=>d.obsP?d.obsP.scores[o.key]:''),d.needSnap?'ใช่':'',...SNAP.map(o=>d.t?d.t.scores[o.key]:''),...SNAP.map(o=>d.p?d.p.scores[o.key]:''),
     d.flagged.map(c=>COND[c]+': '+ASTAT[d.stat(c)]).join(' / ')].map(q).join(','))});
  if(!dl){toast('เบราว์เซอร์นี้ส่งออกไฟล์ไม่ได้');return}
  try{await dl.save({filename:'สรุปผลการคัดกรอง'+(S.filter.school?'_'+S.filter.school:'')+(S.filter.grade?'_'+S.filter.grade:'')+'.csv',data:'﻿'+lines.join('\r\n')});toast('ส่งออกแล้ว')}
  catch(e){if(e.code!=='declined')toast('ส่งออกไม่ได้')}
}

function dbError(e){const x=new Error(e.message||'error');x.code=(e.code==='42501'||/row-level security/i.test(e.message||''))?'ไม่มีสิทธิ์ทำรายการนี้':(e.message||e.code||'ไม่ทราบสาเหตุ');return x}
function makeDb(sb){
  const T={
    students:{cols:'id,name,cid,age,grade,school,village,created_at',key:'id',filter:q=>q.is('deleted_at',null),doc:r=>({name:r.name,cid:r.cid||'',age:r.age||'',grade:r.grade||'',school:r.school||'',village:r.village||''})},
    screenings:{cols:'id,student_id,type,answers,respondent,rel,date,avg,scores,flags,updated_at'+(S.sy?',sy,grade_at':''),key:'id',filter:q=>S.sy?q.eq('sy',S.sy):q,doc:r=>({gradeAt:r.grade_at||'',studentId:r.student_id,type:r.type,answers:r.answers,respondent:r.respondent||'',rel:r.rel||'',date:r.date||'',avg:r.avg||'',scores:r.scores,flags:r.flags})},
    actions:{cols:'student_id,conds,updated_at',key:'student_id',filter:q=>S.sy?q.eq('sy',S.sy):q,doc:r=>({conds:r.conds||{}})}};
  async function fetchAll(t){
    const c=T[t],out=[];
    for(let from=0;;from+=1000){
      let q=sb.from(t).select(c.cols).order(c.key).range(from,from+999);if(c.filter)q=c.filter(q);
      const {data,error}=await q;if(error)throw dbError(error);
      out.push(...data);if(data.length<1000)break}
    return out}
  function watch(t,cb,errcb){
    let alive=true,busy=false,again=false,timer=null;
    const load=async()=>{
      if(!alive)return;if(busy){again=true;return}busy=true;
      try{const rows=await fetchAll(t);if(alive)cb({docs:rows.map(r=>({id:r[T[t].key],data:()=>T[t].doc(r)}))})}
      catch(e){if(alive&&errcb)errcb(e)}
      busy=false;if(again){again=false;load()}};
    const ch=sb.channel('rt-'+t+'-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(timer);timer=setTimeout(load,300)}).subscribe();
    const poll=setInterval(load,30000);load();
    return ()=>{alive=false;clearInterval(poll);clearTimeout(timer);try{sb.removeChannel(ch)}catch(e){}}}
  return {
    collection(t){return {
      add:async o=>{
        if(t!=='students')throw dbError({message:'unsupported'});
        const id=crypto.randomUUID();
        const {error}=await sb.from('students').insert({id,name:o.name,cid:o.cid||'',age:String(o.age||''),grade:o.grade||'',school:o.school||'',village:o.village||''});
        if(error)throw dbError(error);return {id}},
      onSnapshot:(cb,e)=>watch(t,cb,e)}},
    doc(path){const [t,id]=path.split('/');return {
      set:async o=>{
        let row,conflict;
        if(t==='screenings'){row={id,...(S.sy?{sy:S.sy,grade_at:o.gradeAt||''}:{}),student_id:o.studentId,type:o.type,answers:o.answers,respondent:o.respondent||'',rel:o.rel||'',date:o.date||null,avg:o.avg||'',scores:o.scores,flags:o.flags};conflict=S.sy?'id,sy':'id'}
        else if(t==='actions'){row={student_id:id,...(S.sy?{sy:S.sy}:{}),conds:o.conds||{}};conflict=S.sy?'student_id,sy':'student_id'}
        else throw dbError({message:'unsupported'});
        const {error}=await sb.from(t).upsert(row,{onConflict:conflict});if(error)throw dbError(error)},
      delete:async()=>{
        if(t==='students'){const {error}=await sb.from('students').update({deleted_at:new Date().toISOString()}).eq('id',id);if(error)throw dbError(error)}
        /* ผลคัดกรอง/การดำเนินการ: เก็บไว้ (ลบนักเรียนแบบกู้คืนได้) */}}}}}

  forbidden_type:'รหัสนี้ไม่มีสิทธิ์บันทึกแบบประเมินชนิดนี้',forbidden_student:'รหัสนี้ไม่มีสิทธิ์บันทึกให้เด็กคนนี้',bad_data:'ข้อมูลไม่ครบหรือไม่ถูกต้อง'};
function codeErr(r){const x=new Error((r&&r.error)||'error');x.code=CODE_ERR[r&&r.error]||'ไม่ทราบสาเหตุ';x.fatal=!!(r&&(r.error==='invalid'||r.error==='locked'));return x}
async function codeCall(fn,args){
  const {data,error}=await sb.rpc(fn,args);
  if(error)throw dbError(error);
  if(!data||data.ok===false)throw codeErr(data);
  return data}
function makeDbCode(){
  const loaders=new Set();let inflight=null,at=0;
  const fetchCode=()=>{const now=Date.now();if(inflight&&now-at<2500)return inflight;at=now;inflight=codeCall('code_load',{p_code:codeCtx.code});return inflight};
  const MAP={
    students:{rows:d=>d.students,doc:r=>({name:r.name,cid:'',age:r.age||'',grade:r.grade||'',school:r.school||'',village:r.village||''})},
    screenings:{rows:d=>d.screenings,doc:r=>({studentId:r.student_id,type:r.type,answers:r.answers,respondent:r.respondent||'',rel:r.rel||'',date:r.date||'',avg:r.avg||'',scores:r.scores,flags:r.flags})},
    actions:{rows:()=>[],doc:()=>({conds:{}})}};
  function watch(t,cb,errcb){
    let alive=true;
    const load=async()=>{if(!alive||!codeCtx)return;
      try{const d=await fetchCode();if(alive)cb({docs:MAP[t].rows(d).map(r=>({id:r.id||r.student_id,data:()=>MAP[t].doc(r)}))})}
      catch(e){if(alive&&errcb)errcb(e)}};
    loaders.add(load);const poll=setInterval(load,20000);load();
    return ()=>{alive=false;clearInterval(poll);loaders.delete(load)}}
  return {
    collection(t){return {add:async()=>{throw codeErr({error:'forbidden_type'})},onSnapshot:(cb,e)=>watch(t,cb,e)}},
    doc(path){const [t,id]=path.split('/');return {
      set:async o=>{
        if(t!=='screenings')throw codeErr({error:'forbidden_type'});
        const row={id,student_id:o.studentId,type:o.type,answers:o.answers,respondent:o.respondent||'',rel:o.rel||'',date:o.date||null,avg:o.avg||'',scores:o.scores,flags:o.flags};
        await codeCall('code_save',{p_code:codeCtx.code,p:row});
        inflight=null;loaders.forEach(f=>f())},
      delete:async()=>{throw codeErr({error:'forbidden_type'})}}}}}
async function enterCode(code,quiet){
  code=String(code||'').trim().toUpperCase();
  const {data,error}=await sb.rpc('code_load',{p_code:code});
  if(error){return 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่'}
  if(!data||data.ok===false){sessSet('sk_code','');return CODE_ERR[data&&data.error]||'ไม่ทราบสาเหตุ'}
  stopSubs();codeCtx={code,kind:data.kind,school:data.school,grade:data.grade,village:data.village||''};curUid='code';
  sessSet('sk_code',code);
  S.students={};S.shots={};S.actions={};S.sid='';S.draft=null;S.open=null;S.imp=null;S.gate=null;S.codeNote='';S.ready=false;
  S.me={name:data.kind==='staff'?(data.label||''):'',label:data.kind==='staff'?'เจ้าหน้าที่ · '+(data.label||''):data.kind==='asm'?'อสม. · '+vName(data.village):(data.kind==='teacher'?'ครูประจำชั้น':'ผู้ปกครอง')+' · '+data.school+' '+(data.grade==='*'?'(ทุกชั้น)':data.grade),dbRole:'code'};
  S.role=data.kind==='staff'?'staff':data.kind==='teacher'?'teacher':'parent';S.tab=tabsOf()[0][0];S.canWrite=true;
  S.school=data.school;S.grade=data.grade==='*'?'':data.grade;
  db=makeDbCode();
  let first=0;const hit=()=>{if(++first>=3)S.ready=true;refresh()};
  const err=e=>{if(e&&e.fatal){exitCode(e.code);return}toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ กำลังลองใหม่')};
  subsOff.push(db.collection('students').onSnapshot(s=>{S.students=snapToMap(s);if(S.sid&&!S.students[S.sid]){S.sid='';S.draft=null}hit()},err));
  subsOff.push(db.collection('screenings').onSnapshot(s=>{S.shots=snapToMap(s);hit()},err));
  subsOff.push(db.collection('actions').onSnapshot(s=>{S.actions=snapToMap(s);hit()},err));
  render();return ''}

const CODE_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 ตัว ไม่มี I O 0 1 สับสนง่าย
function genCode(){const b=new Uint8Array(10);crypto.getRandomValues(b);return Array.from(b,x=>CODE_ALPHA[x%32]).join('')}
async function sha256hex(t){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(d),x=>x.toString(16).padStart(2,'0')).join('')}
S.codes=null;S.newCode=null;S.newBatch=null;S.qrRegen=false;S.qrExp='';
const ymd=d=>new Date(d.getTime()+7*36e5).toISOString().slice(0,10);
const addDays=n=>ymd(new Date(Date.now()+n*864e5));
const expMin=()=>addDays(1),expMax=()=>addDays(366);
const expIso=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')&&v>=expMin()&&v<=expMax()?new Date(v+'T23:59:59+07:00').toISOString():null;

function bindExp(onset){document.querySelectorAll('[data-expd]').forEach(b=>b.onclick=()=>{const e=$('#'+b.dataset.for);if(e){e.value=addDays(+b.dataset.expd);onset(e.value)}})}
function qrSvg(t){try{if(!window.qrcode)return '';const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag(4,2)}catch(e){return ''}}

function pcard(n){return `<div class="pcard"><div class="pt">${esc(n.title)}</div><div class="pq">${qrSvg(n.link)||'<div class="note">สร้าง QR ไม่ได้ (ไม่มีอินเทอร์เน็ต)</div>'}</div><div class="pc">${esc(n.code)}</div><div class="pn">สแกน QR หรือพิมพ์รหัสที่<br>${esc(APPURL())}<br>หมดอายุ ${new Date(n.exp).toLocaleDateString('th-TH')}</div></div>`}
function batchPlan(regen){
  const all=Object.keys(S.students).map(i=>S.students[i]);
  const schools=[...new Set(all.map(x=>x.school).filter(Boolean))].sort(natSort);
  const now=Date.now(),live=c=>c.active&&new Date(c.expires_at).getTime()>now;
  const cs=(S.codes||[]).filter(live);
  const items=[],skipped=[];
  schools.forEach(sc=>{const t={kind:'teacher',school:sc,grade:'*',village:'',title:sc+' ทุกชั้น (ครู)'};t.old=cs.filter(c=>c.kind==='teacher'&&c.school===sc&&c.grade==='*').map(c=>c.id);((t.old.length&&!regen)?skipped:items).push(t)});
  Object.keys(VILLAGES).forEach(v=>{const t={kind:'asm',school:'',grade:'',village:v,title:'อสม. '+vName(v)};t.old=cs.filter(c=>c.kind==='asm'&&c.village===v).map(c=>c.id);((t.old.length&&!regen)?skipped:items).push(t)});
  return {items,skipped,nSchool:schools.length}}

function viewCodes(){

  const now=Date.now(),asm=sel.kind==='asm',staff=sel.kind==='staff';

  if(uid!==curUid)return;
  if(error||!data||!data.active){S.gate=noAccessGate(error&&error.message,session&&session.user&&session.user.email);S.ready=true;render();return}
  if(pwLogin&&data.role!=='officer'){pwLogin=false;S.loginNote='เข้าด้วยรหัสผ่านได้เฉพาะผู้ดูแลระบบ เจ้าหน้าที่ทั่วไปให้ใส่รหัสประจำตัวในหน้าแรก';sb.auth.signOut();return}
  pwLogin=false;
  S.me={name:data.display_name||session.user.email||'',dbRole:data.role};
  S.role=ROLE_UI[data.role];S.tab=TABS[S.role][0][0];S.canWrite=true;
  await initYear(data.role);if(uid!==curUid)return;
  db=makeDb(sb);startOfficerSubs();
  render();
}
(async()=>{
  S.ready=false;render();
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||!window.supabase){S.gate=setupGate();S.ready=true;render();return}
  let urlCode='';try{const m=location.hash.match(/[#&]c=([A-Za-z0-9]{6,16})/);if(m){urlCode=m[1];history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((evt,session)=>{handleSession(session)});
  const savedCode=urlCode||sessGet('sk_code');
  if(savedCode){const r=await enterCode(savedCode,true);if(!r)return;S.codeNote=r}
  const {data}=await sb.auth.getSession();handleSession(data.session);
})();
</script>
